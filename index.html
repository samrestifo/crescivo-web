          "founder": [
            { "@type": "Person", "name": "Sam Restifo" },
            { "@type": "Person", "name": "Guy Pozniak" },
            { "@type": "Person", "name": "Jason Serda" }
          ],
          "areaServed": "AU",
          "sameAs": ["https://www.linkedin.com/company/crescivo-partners"]

        {
          "@type": "WebSite",
          "@id": "https://www.crescivo.partners/#website",
          "name": "Crescivo",
          "url": "https://www.crescivo.partners/",
          "publisher": { "@id": "https://www.crescivo.partners/#org" },

        {
          "@type": "ProfessionalService",
          "@id": "https://www.crescivo.partners/#service",

    <!-- Preconnect for fonts — non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — display=swap so text shows immediately in fallback -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500;600&display=swap"

    />

    <!-- Preload hero images — browser picks correct one via media query. -->
    <link rel="preload" href="/images/hero-mountain-desktop.webp" as="image" type="image/webp" media="(min-width: 961px)" />
    <link rel="preload" href="/images/hero-mountain-mobile.webp" as="image" type="image/webp" media="(max-width: 960px)" />
